<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register Account</title>
        <link rel = "stylesheet" href = "style.css"/>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    </head>
    <body>
        <div class = "signing">
            <div class = "greetings">
                <h1>Create Account</h1>
                <p>Register to get started</p>
            </div>
            <form>
                <div class= "input-group">
                <label for = "fname">Full Name</label>
                <input id = "fname" type = "text" placeholder="Enter full name" required/>

                <label for = "register-email">Email</label>
                <input id = "register-email" type = "email" placeholder="Enter your email" required/>
                
                <label for = "register-password">Password</label>
                <input id = "register-password" type = "password" placeholder="Create a password" required/>
                
                <label for = "confirm-password">Confirm Password</label>
                <input id = "confirm-password" type = "password" placeholder = "Confirm your password" required/>
                <input class="lr-button" type="submit" value="Register"/>
            </form>
           
            <div class = "rl-button">
                <p>already have an account? 
                <a class = "link"href = "login.html">Login</a>

                </p>
            </div>
        </div>
    </body>
</html>
